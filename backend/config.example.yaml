database:
  path: ./data/llos_backend.db
  default_results_limit: 20

models:
  default_model_key: lightgbm_t5
  bundles:
    lightgbm_t5:
      display_name: T5 + BiLSTM + LightGBM
      description: Current predict.ipynb LOS model.
      adapter: t5_bilstm_lightgbm
      model_weights_path: /Users/william/Documents/LLOS/data/models/los_model_weights.pt
      lgbm_model_path: /Users/william/Documents/LLOS/data/models/lgbm_los_model.txt
      extractor_config_path: /Users/william/Documents/LLOS/data/models/t5_extractor_config.json
      cache_dir: /Users/william/Documents/LLOS/data/processed/t5_cache
    ensemble_mean:
      display_name: "Ensemble (RF + XGB + LGBM + SVR, mean)"
      description: >-
        Average of the four ensemble regressors. Isaac's tuned regressors over T5-small section embeddings (PCA 139) + token
        counts + demographics, trained on a 5,026-encounter Synthea cohort where
        every stay is >= 14 days. Estimates how long a long stay lasts, not
        whether a stay will be long.
      adapter: tabular_ensemble
      member: mean
      weights_dir: /Users/william/Documents/LLOS/data/models/ensemble
    ensemble_rf:
      display_name: "Ensemble member: Random Forest"
      description: >-
        Isaac's tuned regressors over T5-small section embeddings (PCA 139) + token
        counts + demographics, trained on a 5,026-encounter Synthea cohort where
        every stay is >= 14 days. Estimates how long a long stay lasts, not
        whether a stay will be long.
